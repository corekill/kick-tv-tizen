name: Release Lite

on:
  push:
    tags:
      - "v*-lite"

permissions:
  contents: write

jobs:
  release-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils zip unzip
      - name: Verify Lite tag matches config version
        run: |
          version="$(xmllint --xpath 'string(/*[local-name()="widget"]/@version)' kick-tv-lite/config.xml)"
          test "v$version-lite" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Lite version v$version-lite" >&2
            exit 1
          }
      - name: Build Lite package
        run: ./scripts/build-lite.sh
      - name: Publish experimental Lite release
        uses: softprops/action-gh-release@v2
        with:
          name: Kick TV Lite 1.0.3 — direct HLS test for Tizen 3
          prerelease: true
          body: |
            ## Čeština

            Samostatná odlehčená verze pro starší Samsung TV s Tizenem 3.0.

            Po diagnostice z reálné Tizen 3 televize tato verze obchází Amazon IVS master playlist, na kterém starý AVPlay zůstával ve stavu IDLE. Aplikace načte dostupné H.264 varianty a přehrávači předá přímo zvolený media playlist. Nabídka kvality proto ukazuje pouze varianty skutečně dostupné pro daný stream.

            Diagnostika na šipce dolů nyní navíc zobrazuje master i přímý playlist, model, kód modelu a firmware televize.

            Jde o experimentální balíček, protože zatím nebyl ověřený na skutečné Tizen 3 televizi. Používá vlastní ID aplikace a nepřepisuje běžnou Kick TV.

            ## English

            A separate lightweight build for older Samsung TVs running Tizen 3.0.

            Based on diagnostics from a real Tizen 3 television, this version bypasses the Amazon IVS master playlist that left old AVPlay stuck in IDLE. The app reads the available H.264 renditions and opens the selected media playlist directly. The quality menu therefore shows only renditions actually available for the current stream.

            Press Down to open diagnostics, which now include the master and direct playlist, TV model, model code, and firmware.

            This is an experimental build because it has not yet been verified on a real Tizen 3 television. It uses a separate application ID and does not replace the standard Kick TV app.
          files: |
            dist/KickTV-Lite.wgt
            dist/KickTV-Lite.wgt.sha256
