name: Release Lite

on:
  push:
    tags:
      - "v*-lite"

permissions:
  contents: write

jobs:
  release-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils zip unzip
      - name: Verify Lite tag matches config version
        run: |
          version="$(xmllint --xpath 'string(/*[local-name()="widget"]/@version)' kick-tv-lite/config.xml)"
          test "v$version-lite" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Lite version v$version-lite" >&2
            exit 1
          }
      - name: Build Lite package
        run: ./scripts/build-lite.sh
      - name: Publish experimental Lite release
        uses: softprops/action-gh-release@v2
        with:
          name: Kick TV Lite 1.1.0 — diagnostics and real-TV feedback
          prerelease: true
          body: |
            ## Čeština

            Samostatná odlehčená verze pro starší Samsung TV s Tizenem 3.0.

            Přehrávání, automatická i ruční kvalita a živý chat jsou nyní ověřené na skutečné Samsung UE49MU7075 s Tizenem 3.0. Diagnostika přehrávače se otevře až po trojím rychlém stisknutí šipky dolů.

            Díky @anyrobert za odhalení změny Pusher klíče a opravu v PR #8. Připojovací údaje teď získáváme dynamicky přímo z Kicku; při výpadku se použije poslední uložená konfigurace nebo záloha. Opravené je také překrývání dlouhých zpráv.

            Lite nabízí novou dobrovolnou výkonovou diagnostiku. Po výslovném souhlasu odesílá pouze technické údaje o CPU, RAM, úložišti, odezvě aplikace a AVPlay. Nikdy neposílá sledované kanály, historii, chat ani streamovací adresy a lze ji kdykoli vypnout.

            Velké poděkování patří @fightspit za trpělivé testování Lite na skutečné Tizen 3 televizi a za podrobné reporty v issue #1.

            ## English

            A separate lightweight build for older Samsung TVs running Tizen 3.0.

            Playback, automatic and manual quality selection, and live chat are now verified on a real Samsung UE49MU7075 running Tizen 3.0. Player diagnostics now require three quick presses of Down, preventing accidental activation.

            Thanks to @anyrobert for identifying the Pusher key change and contributing PR #8. Connection settings are now discovered dynamically from Kick, with cached and built-in fallbacks. Wrapped messages also keep their height instead of overlapping.

            Lite now offers optional performance diagnostics. After explicit consent, it sends only technical CPU, memory, storage, responsiveness, and AVPlay metrics. It never sends watched channels, history, chat, or stream URLs and can be disabled at any time.

            Special thanks to @fightspit for patiently testing Lite on real Tizen 3 hardware and sharing detailed feedback in issue #1.
          files: |
            dist/KickTV-Lite.wgt
            dist/KickTV-Lite.wgt.sha256
